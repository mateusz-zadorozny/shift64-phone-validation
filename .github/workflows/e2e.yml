name: E2E

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  # Weekly against whatever WordPress and WooCommerce are current, so a new major release
  # is noticed before users report it ("Tested up to" / "WC tested up to").
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  # Pull requests that change only allowlisted documentation skip the jobs below
  # (scripts/ci-docs-only.sh, docs/CI-CD-SETUP.md "Docs-only pull requests"). Pushes, the
  # schedule and manual runs always run them, and so does any failure here: the jobs below
  # skip only when this job answered "true".
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Three dots: changes since the merge base, so commits that landed on master
            # meanwhile do not count. --no-renames lists both sides of a rename.
            if files="$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")"; then
              docs_only="$(printf '%s\n' "$files" | ./scripts/ci-docs-only.sh)" || docs_only=false
              {
                echo "Docs-only change: **${docs_only}**"
                echo
                echo '```'
                printf '%s\n' "$files"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Could not list the changed files; running every check."
            fi
          fi
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  playwright:
    name: Playwright (wp-env + WooCommerce)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies (plugin runtime)
        run: composer install --prefer-dist --no-dev --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start WordPress + WooCommerce (wp-env) and seed the store
        run: npx wp-env start

      - name: Show WordPress and WooCommerce versions
        run: |
          # wp-env adds status lines around the output; keep the version-shaped line only.
          version_of() { npx wp-env run cli "$@" 2>/dev/null | grep -E '^[0-9]+(\.[0-9]+)+' | tail -n 1 || true; }
          wp_version="$(version_of wp core version)"
          # Not `wp plugin get woocommerce`: wp-env installs the ZIP into woocommerce.latest-stable/.
          wc_version="$(version_of wp eval 'echo WC_VERSION;')"
          echo "WordPress ${wp_version:-unknown}, WooCommerce ${wc_version:-unknown}"
          echo "E2E ran against WordPress ${wp_version:-unknown} and WooCommerce ${wc_version:-unknown} (PHP 8.3)." >> "$GITHUB_STEP_SUMMARY"

      - name: Run e2e tests
        env:
          # wp-env's built-in demo admin account (disposable, local to the job).
          TEST_ADMIN_USER: admin
          TEST_ADMIN_PASSWORD: password
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Show WordPress debug log on failure
        if: failure()
        run: npx wp-env run cli cat /var/www/html/wp-content/debug.log || true

  # The demo network (.wp-env.demo.json): a subdirectory multisite with WooCommerce and
  # the plugin network-activated, where #38 and the textdomain registration in the main
  # plugin file came from. A separate job, so a failure here never hides the single-site
  # suite above, which stays the main gate.
  playwright-multisite:
    name: Playwright (multisite demo)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies (plugin runtime)
        run: composer install --prefer-dist --no-dev --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start the demo network (wp-env multisite) and seed every scenario site
        run: npx wp-env start --config=.wp-env.demo.json

      - name: Run the multisite smoke spec
        env:
          WP_DEMO: "1"
          # wp-env's built-in demo admin account (disposable, local to the job).
          TEST_ADMIN_USER: admin
          TEST_ADMIN_PASSWORD: password
        run: npx playwright test --project=demo

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-multisite
          path: playwright-report/
          retention-days: 7

      - name: Show WordPress debug log on failure
        if: failure()
        run: npx wp-env run --config=.wp-env.demo.json cli cat /var/www/html/wp-content/debug.log || true
