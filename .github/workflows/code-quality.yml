name: Code Quality

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  # Pull requests that change only allowlisted documentation skip the jobs below
  # (scripts/ci-docs-only.sh, docs/CI-CD-SETUP.md "Docs-only pull requests"). Pushes, the
  # schedule and manual runs always run them, and so does any failure here: the jobs below
  # skip only when this job answered "true".
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Three dots: changes since the merge base, so commits that landed on master
            # meanwhile do not count. --no-renames lists both sides of a rename.
            if files="$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")"; then
              docs_only="$(printf '%s\n' "$files" | ./scripts/ci-docs-only.sh)" || docs_only=false
              {
                echo "Docs-only change: **${docs_only}**"
                echo
                echo '```'
                printf '%s\n' "$files"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Could not list the changed files; running every check."
            fi
          fi
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  phpcs:
    name: PHPCS
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2, cs2pr

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Run PHPCS
        run: composer phpcs -- --report-full --report-checkstyle=./phpcs-report.xml

      - name: Show PHPCS results in PR
        if: always()
        run: cs2pr ./phpcs-report.xml

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      # Level and scope live in phpstan.neon.dist. The github format turns every finding
      # into an inline annotation on the PR diff.
      - name: Run PHPStan
        run: composer phpstan -- --no-progress --error-format=github

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      # An ABSPATH guard reached outside WordPress makes PHPUnit exit 0 with no output, which
      # would look green. Require the summary line so a silent exit fails the job; "OK, but
      # incomplete, skipped, or risky tests!" is still a pass. An explicit `shell: bash` runs
      # with -o pipefail, so a failing PHPUnit fails the step through the tee as well.
      - name: Run unit tests
        shell: bash
        run: |
          composer test | tee phpunit.log
          grep -Eq '^OK( \(|, but )' phpunit.log

  package:
    name: Package + Plugin Check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Plugin Check keeps one summary comment on the PR up to date.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      # The same script release.yml uses for the GitHub ZIP and WordPress.org SVN trunk.
      - name: Build plugin package
        id: build
        run: ./scripts/build-package.sh "${RUNNER_TEMP}/package"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: shift64-phone-validation
          path: ${{ steps.build.outputs.zip }}
          retention-days: 14

      # Runs the latest Plugin Check on the built folder in wp-env (latest WordPress), with
      # WooCommerce installed from "Requires Plugins". Any ERROR fails the job; WARNINGs are
      # reported as annotations and in the PR comment but do not fail it. One is expected and
      # accepted, load_plugin_textdomainFound for the main plugin file (docs/CI-CD-SETUP.md,
      # Plugin Check), so any other warning here is new.
      - name: Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ steps.build.outputs.dir }}
          wp-version: latest
